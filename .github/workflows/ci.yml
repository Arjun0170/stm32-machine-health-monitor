name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential python3-matplotlib

      - name: Install pinned Renode and ARM GCC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/renode" "$RUNNER_TEMP/tools/gcc"

          curl --fail --location --retry 3 \
            https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz \
            --output "$RUNNER_TEMP/renode.tar.gz"
          echo '4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f  '"$RUNNER_TEMP/renode.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/renode.tar.gz" -C "$RUNNER_TEMP/tools/renode"
          renode_bin="$(find "$RUNNER_TEMP/tools/renode" -type f -name renode -print -quit)"
          test -n "$renode_bin"
          chmod +x "$renode_bin"
          echo "RENODE=$renode_bin" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/arm-none-eabi-gcc.tar.gz"
          echo 'da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6  '"$RUNNER_TEMP/arm-none-eabi-gcc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/arm-none-eabi-gcc.tar.gz" -C "$RUNNER_TEMP/tools/gcc"
          gcc_bin="$(find "$RUNNER_TEMP/tools/gcc" -type f -path '*/bin/arm-none-eabi-gcc' -print -quit)"
          test -n "$gcc_bin"
          echo "$(dirname "$gcc_bin")" >> "$GITHUB_PATH"

      - name: Build, test, and run integration demo
        run: make all host-test demo

      - name: Upload build and evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32-machine-health-monitor-build-evidence
          path: |
            build/
            docs/
            evidence/
          if-no-files-found: warn
